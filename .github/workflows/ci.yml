name: CI

on:
  push:
    branches: [desarrollo, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar-y-probar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint, pruebas y APK de depuración
        run: |
          set -o pipefail
          ./gradlew lintDebug testDebugUnitTest assembleDebug assembleRelease --stacktrace --console=plain 2>&1 | tee build.log

      - name: Tamaño del APK final
        if: success()
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          TAM=$(stat -c%s "$APK")
          echo "::notice title=Tamaño APK release::$TAM bytes ($(( TAM / 1024 )) KB)"
          test "$TAM" -lt 10485760 || { echo "::error::El APK pesa más de 10 MB"; exit 1; }

      - name: Informe de errores
        if: failure()
        run: python3 .github/scripts/informe_errores.py

      - name: Guardar APK de depuración
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nummia-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
