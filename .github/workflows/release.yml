name: Publicar versión

# Se publica sola: al llegar a main una versión (versionMayor/Menor/Corrección) que aún no tiene
# publicación, GitHub crea la etiqueta vX.Y.Z y la publicación con el APK firmado.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Robolectric descarga su Android de pruebas de Maven en cada ejecución: si la descarga falla, fallan las pruebas.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
      - uses: gradle/actions/setup-gradle@v4

      - name: Versión de la app
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python3 - <<'PY'
          import re
          s = open("app/build.gradle.kts").read()
          g = lambda n: re.search(rf"val {n} = (\d+)", s).group(1)
          print(f"v{g('versionMayor')}.{g('versionMenor')}.{g('versionCorreccion')}")
          PY
          )
          echo "etiqueta=$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$V" >/dev/null; then
            echo "La versión $V ya está publicada; no hay nada que hacer."
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          else
            echo "Se publicará $V"
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar la firma
        if: steps.v.outputs.publicar == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Falta el secreto KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nummia.jks"
          echo "NUMMIA_KEYSTORE_PATH=$RUNNER_TEMP/nummia.jks" >> "$GITHUB_ENV"

      - name: Pruebas y APK firmado
        if: steps.v.outputs.publicar == 'true'
        env:
          NUMMIA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NUMMIA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NUMMIA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          # Un reintento si falla: a veces una descarga de GitHub (p. ej. Robolectric) se corta.
          ./gradlew testDebugUnitTest assembleRelease --stacktrace --console=plain 2>&1 | tee build.log || {
            echo "::warning::Primer intento fallido; se reintenta una vez."
            ./gradlew testDebugUnitTest assembleRelease --stacktrace --console=plain 2>&1 | tee build.log
          }

      - name: Verificar firma, tamaño y huella
        if: steps.v.outputs.publicar == 'true'
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::No se generó el APK firmado"; exit 1; }
          "$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "$APK"
          TAM=$(stat -c%s "$APK")
          echo "Tamaño: $TAM bytes"
          test "$TAM" -lt 10485760 || { echo "::error::El APK pesa más de 10 MB ($TAM bytes)"; exit 1; }
          mkdir -p salida
          cp "$APK" "salida/nummia-${{ steps.v.outputs.etiqueta }}.apk"
          (cd salida && sha256sum "nummia-${{ steps.v.outputs.etiqueta }}.apk" > "nummia-${{ steps.v.outputs.etiqueta }}.apk.sha256")
          cat salida/*.sha256

      - name: Notas de la versión
        if: steps.v.outputs.publicar == 'true'
        run: |
          VERSION="${{ steps.v.outputs.etiqueta }}"; VERSION="${VERSION#v}"
          awk -v v="## [$VERSION]" 'index($0, v) == 1 {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notas.md
          test -s notas.md || { echo "::error::CHANGELOG.md no tiene sección para $VERSION"; exit 1; }
          cat notas.md

      - name: Crear la publicación en GitHub
        if: steps.v.outputs.publicar == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.etiqueta }}
          target_commitish: ${{ github.sha }}
          name: Nummia ${{ steps.v.outputs.etiqueta }}
          body_path: notas.md
          make_latest: true
          files: |
            salida/nummia-${{ steps.v.outputs.etiqueta }}.apk
            salida/nummia-${{ steps.v.outputs.etiqueta }}.apk.sha256

      - name: Informe de errores
        if: failure()
        run: python3 .github/scripts/informe_errores.py
