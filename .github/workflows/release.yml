name: Publicar versión

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Comprobar que la etiqueta coincide con la versión de la app
        run: |
          V=$(python3 - <<'PY'
          import re
          s = open("app/build.gradle.kts").read()
          g = lambda n: re.search(rf"val {n} = (\d+)", s).group(1)
          print(f"v{g('versionMayor')}.{g('versionMenor')}.{g('versionCorreccion')}")
          PY
          )
          echo "Versión en el código: $V · etiqueta: $GITHUB_REF_NAME"
          test "$V" = "$GITHUB_REF_NAME"

      - name: Preparar la firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Falta el secreto KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nummia.jks"
          echo "NUMMIA_KEYSTORE_PATH=$RUNNER_TEMP/nummia.jks" >> "$GITHUB_ENV"

      - name: Pruebas y APK firmado
        env:
          NUMMIA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NUMMIA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NUMMIA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleRelease --stacktrace --console=plain 2>&1 | tee build.log

      - name: Verificar firma, tamaño y huella
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::No se generó el APK firmado"; exit 1; }
          "$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "$APK"
          TAM=$(stat -c%s "$APK")
          echo "Tamaño: $TAM bytes"
          test "$TAM" -lt 10485760 || { echo "::error::El APK pesa más de 10 MB ($TAM bytes)"; exit 1; }
          mkdir -p salida
          cp "$APK" "salida/nummia-$GITHUB_REF_NAME.apk"
          (cd salida && sha256sum "nummia-$GITHUB_REF_NAME.apk" > "nummia-$GITHUB_REF_NAME.apk.sha256")
          cat salida/*.sha256

      - name: Notas de la versión
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="## [$VERSION]" 'index($0, v) == 1 {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notas.md
          test -s notas.md || { echo "::error::CHANGELOG.md no tiene sección para $VERSION"; exit 1; }
          cat notas.md

      - name: Crear la publicación en GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: Nummia ${{ github.ref_name }}
          body_path: notas.md
          files: |
            salida/nummia-${{ github.ref_name }}.apk
            salida/nummia-${{ github.ref_name }}.apk.sha256

      - name: Informe de errores
        if: failure()
        run: python3 .github/scripts/informe_errores.py
